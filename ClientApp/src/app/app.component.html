<div class="layout" [class.sidebar-open]="showSidebar()">
  <!-- Desktop header -->
  <div class="header">
    <span class="app-title">{{ appComponentText.header.title }}</span>
    <span class="tagline">{{ appComponentText.header.tagline }}</span>
  </div>

  <!-- Mobile bar (replaces header on small screens) -->
  <div class="mobile-bar">
    <button type="button" class="menu-toggle" (click)="toggleSidebar()" aria-label="Toggle navigation" [attr.aria-expanded]="showSidebar()">
      <span class="icon" aria-hidden="true">☰</span>
      <span class="title">{{ appComponentText.header.title }}</span>
    </button>
  </div>

  <div class="main">
    <!-- Sidebar (overlay on mobile) -->
    <nav class="sidebar" aria-label="Main navigation" [class.is-open]="showSidebar()">
      <button type="button" class="close-btn" (click)="closeSidebar()" aria-label="Close navigation">×</button>
      <span routerLink="/authentication" routerLinkActive="active" (click)="closeSidebar()">{{ appComponentText.menu.authentication }}</span>
      <span routerLink="/neighbors" routerLinkActive="active" (click)="closeSidebar()">{{ appComponentText.menu.neighbors }}</span>
      <span routerLink="/scissors" routerLinkActive="active" (click)="closeSidebar()">{{ appComponentText.menu.scissors }}</span>
    </nav>
    <div class="content" (click)="showSidebar() && closeSidebar()">
      <router-outlet></router-outlet>
    </div>
  </div>

  <!-- Overlay backdrop for mobile when sidebar open -->
  <div class="backdrop" *ngIf="showSidebar()" (click)="closeSidebar()" aria-hidden="true"></div>
</div>
