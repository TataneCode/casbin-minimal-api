<div class="layout" [class.sidebar-open]="showSidebar()">
  <!-- Desktop header -->
  <div class="header">
    <span class="app-title">{{ appComponentText.header.title }}</span>
    <span class="tagline">{{ appComponentText.header.tagline }}</span>
    <div class="spacer"></div>
    <button type="button" class="auth-btn" routerLink="/authentication" routerLinkActive="active" [attr.aria-label]="appComponentText.menu.authentication">
      <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
      <span class="auth-label">{{ appComponentText.menu.authentication }}</span>
    </button>
    <button type="button" class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="theme() === 'dark' ? appComponentText.header.lightModeLabel : appComponentText.header.darkModeLabel" [attr.aria-pressed]="theme() === 'dark'">
      <i class="fa-solid" [class.fa-moon]="theme() !== 'dark'" [class.fa-sun]="theme() === 'dark'" aria-hidden="true"></i>
      <span class="visually-hidden">{{ theme() === 'dark' ? appComponentText.header.lightModeLabel : appComponentText.header.darkModeLabel }}</span>
    </button>
  </div>

  <!-- Mobile bar (replaces header on small screens) -->
  <div class="mobile-bar">
    <div class="mobile-bar-inner">
      <button type="button" class="menu-toggle" (click)="toggleSidebar()" aria-label="Toggle navigation" [attr.aria-expanded]="showSidebar()">
        <span class="icon" aria-hidden="true">☰</span>
        <span class="title">{{ appComponentText.header.title }}</span>
      </button>
      <button type="button" class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="theme() === 'dark' ? appComponentText.header.lightModeLabel : appComponentText.header.darkModeLabel" [attr.aria-pressed]="theme() === 'dark'">
        <i class="fa-solid" [class.fa-moon]="theme() !== 'dark'" [class.fa-sun]="theme() === 'dark'" aria-hidden="true"></i>
        <span class="visually-hidden">{{ theme() === 'dark' ? appComponentText.header.lightModeLabel : appComponentText.header.darkModeLabel }}</span>
      </button>
    </div>
  </div>

  <div class="main">
    <!-- Sidebar (overlay on mobile) -->
    <nav class="sidebar" aria-label="Main navigation" [class.is-open]="showSidebar()">
      <button type="button" class="close-btn" (click)="closeSidebar()" aria-label="Close navigation">×</button>
      <span routerLink="/neighbors" routerLinkActive="active" (click)="closeSidebar()">{{ appComponentText.menu.neighbors }}</span>
      <span routerLink="/scissors" routerLinkActive="active" (click)="closeSidebar()">{{ appComponentText.menu.scissors }}</span>
      <span routerLink="/stuffs" routerLinkActive="active" (click)="closeSidebar()">{{ appComponentText.menu.stuffs }}</span>
    </nav>
    <div class="content" (click)="showSidebar() && closeSidebar()">
      <router-outlet></router-outlet>
    </div>
  </div>

  <!-- Overlay backdrop for mobile when sidebar open -->
  <div class="backdrop" *ngIf="showSidebar()" (click)="closeSidebar()" aria-hidden="true"></div>
</div>
