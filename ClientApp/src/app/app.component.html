<div class="layout">
  <mat-toolbar class="header mat-elevation-z4" color="primary">
    <button mat-icon-button (click)="sidenav.toggle()" class="menu-btn">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="title">{{ text.title }}</span>
    <span class="spacer"></span>

    <mat-slide-toggle
      class="theme-toggle"
      [checked]="darkMode()"
      (change)="onThemeChange($event.checked)"
      aria-label="Toggle theme"
      color="accent"
    >
      <mat-icon>{{ darkMode() ? 'dark_mode' : 'light_mode' }}</mat-icon>
    </mat-slide-toggle>

    <button mat-icon-button [attr.aria-label]="text.buttons.account">
      <mat-icon>account_circle</mat-icon>
    </button>
  </mat-toolbar>


  <mat-sidenav-container class="main">
    <mat-sidenav #sidenav mode="side" [opened]="true">
      <nav class="menu">
        <button mat-button routerLink="/" routerLinkActive="active">
          {{ text.buttons.home }}
        </button>
        <button mat-button routerLink="/neighbors" routerLinkActive="active">
          {{ text.buttons.neighbors }}
        </button>
        <button mat-button routerLink="/stuffs" routerLinkActive="active">
          {{ text.buttons.stuffs }}
        </button>
      </nav>
    </mat-sidenav>

    <mat-sidenav-content class="content">
      <router-outlet></router-outlet>
      <p>{{ text.mainContent }}</p>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
