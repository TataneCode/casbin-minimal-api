<div class="layout">
  <!-- HEADER -->
  <mat-toolbar class="header mat-elevation-z4" color="primary">
    <button mat-icon-button (click)="sidenav.toggle()" class="menu-btn">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="title">{{ title }}</span>
    <span class="spacer"></span>
    <button mat-icon-button>
      <mat-icon>account_circle</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="main">
    <mat-sidenav #sidenav mode="side" opened>
      <nav class="menu">
        <button mat-button>{{ appComponentText.buttons.home }}</button>
        <button mat-button>{{ appComponentText.buttons.profile }}</button>
        <button mat-button>{{ appComponentText.buttons.settings }}</button>
      </nav>
    </mat-sidenav>

    <mat-sidenav-content class="content">
      <p>{{ appComponentText.mainContent }}</p>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
