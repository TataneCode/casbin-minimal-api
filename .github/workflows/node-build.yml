name: Angular CI

on:
  workflow_call:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./ClientApp

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ClientApp/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint TypeScript and Templates
        run: npm run lint
      
      - name: Lint Styles
        run: npm run lint:styles
      
      - name: Run tests
        run: npm run test
      
      - name: Build
        run: npm run build
