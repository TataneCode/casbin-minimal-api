name: Build and Push Docker image

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet_ci:
    uses: ./.github/workflows/dotnet-build.yml

  node_ci:
    uses: ./.github/workflows/node-build.yml

  publish_api:
    name: Publish API image
    needs: [dotnet_ci, node_ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check DockerHub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "ERROR: DockerHub secrets DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN are not set."
            echo "Please add them in: Settings → Secrets and variables → Actions for this repository."
            exit 1
          fi

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CasbinMinimalApi/Dockerfile
          push: true
          tags: |
            tatanecode/casbin-minimal-api:latest
            tatanecode/casbin-minimal-api:${{ github.sha }}

  publish_front:
    name: Publish Frontend image
    needs: [dotnet_ci, node_ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check DockerHub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "ERROR: DockerHub secrets DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN are not set."
            echo "Please add them in: Settings → Secrets and variables → Actions for this repository."
            exit 1
          fi

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ClientApp
          file: ClientApp/Dockerfile
          push: true
          tags: |
            tatanecode/casbin-minimal-api-frontend:latest
            tatanecode/casbin-minimal-api-frontend:${{ github.sha }}
